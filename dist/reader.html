<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>盐译 · 翻译窗口</title>  <script type="module" crossorigin src="./assets/reader-DWxpOD59.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/reader-CJK3aW5h.css">

<link rel="stylesheet" href="./assets/figma-sync.css">
</head><body class="reader-app"><header class="reader-top"><div class="reader-brand"><img src="./assets/oneclear-master.svg" width="36" height="36" alt=""><div class="brand-copy"><strong>盐译</strong><small class="brand-english" aria-label="OneClear"><span class="oneclear-wordmark" aria-hidden="true"></span></small></div><span class="section-title">翻译窗口</span></div><nav aria-label="阅读工具"><button id="new">新文本</button><button id="edit" hidden>编辑原文</button><span id="translate-tools" hidden><select id="language" aria-label="目标语言"></select><select id="model" aria-label="模型"></select><button id="translate" class="primary">翻译</button><button id="stop" hidden>暂停</button><select id="mode" aria-label="显示模式" hidden><option value="original">原文</option><option value="dual">双语</option><option value="translation">仅译文</option></select></span><div class="appearance"><button id="light" title="浅色模式" aria-label="浅色模式"><img src="./assets/reader-sun.svg" alt=""></button><button id="dark" title="深色模式" aria-label="深色模式"><img src="./assets/reader-moon.svg" alt=""></button></div><button id="settings">设置</button></nav></header><p id="message" role="status" class="reader-message"></p><main><section id="editor"><h1>让文字，成为适合阅读的页面。</h1><label class="sr-only" for="source">原文</label><textarea id="source" placeholder="在此粘贴需要阅读的文本" maxlength="500000" spellcheck="false"></textarea><div class="editor-bottom"><span id="count">0 字符</span><button id="clear">清空</button><span class="render-hint">将文本排版为阅读页面</span><button id="render" class="primary" disabled>排版阅读</button></div><p class="local-note">内容仅保存在本机。排版阅读不发送文本；点击翻译后才调用你的模型。</p></section><article id="document" hidden aria-label="文档阅读"></article></main></body></html>
